[general]
font-sans = "Noto Sans"
font-mono = "Noto Sans Mono"
tearing-mode = true

[bar]
location = "bottom"
bg = "transparent"

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "battery",
    "network",
    "bluetooth",
    "keyboard-input",
]
center = ["hyprland-workspaces"]
right = [
    "systray",
    "clock",
    "microphone",
    "volume",
    "notifications",
]

[[bar.layout]]
monitor = "DP-2"
show = true
left = []
center = []
right = [
    "hyprland-workspaces",
    "keyboard-input",
    "clock",
    "volume",
    "notifications",
]

[styling.palette]
bg = "#000000"
surface = "#000000"
fg-muted = "#77767b"
primary = "#ffffff"
red = "#deddda"
yellow = "#c0bfbc"
green = "#9a9996"
blue = "#f6f5f4"

[modules.dashboard]
dropdown-lock-command = "hyprlock"
dropdown-logout-command = "hyprshutdown"
dropdown-reboot-command = "systemctl reboohyprshutdown -t 'Restarting...' --post-cmd 'reboot'"
dropdown-poweroff-command = "hyprshutdown -t 'Shutting down...' --post-cmd 'shutdown -P 0 --no-wall'"

[modules.hyprland-workspaces]
min-workspace-count = 10
show-special = false
display-mode = "icon"
numbering = "relative"
app-icons-show = true

[modules.keyboard-input]
icon-show = false

[modules.keyboard-input.layout-alias-map]
"English (US)" = "EN"
Estonian = "EE"
Russian = "RU"

[modules.notifications]
popup-position = "bottom-right"

[osd]
position = "right"
